name: Test

on:
  push:
  pull_request:

# Tests need no write access (and pull requests from forks get none).
permissions:
  contents: read

jobs:
  windows:
    name: Test (Windows, MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: synccrate/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: synccrate
        run: npm ci

      # tauri::generate_context!() embeds the frontend dist, so cargo test
      # needs a real build first, not just node_modules.
      - name: Build frontend
        working-directory: synccrate
        run: npm run build

      - name: Typecheck frontend
        working-directory: synccrate
        run: npx tsc --noEmit

      - name: cargo test
        working-directory: synccrate/src-tauri
        run: cargo test

  linux:
    name: Test (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: synccrate/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Linux dependencies required by Tauri (see release.yml)
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: synccrate
        run: npm ci

      - name: Build frontend
        working-directory: synccrate
        run: npm run build

      - name: cargo test
        working-directory: synccrate/src-tauri
        run: cargo test
