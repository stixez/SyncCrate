name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string

# Every action is pinned to a commit: this workflow holds the updater
# signing key, and a moved tag on a third-party action would run its code
# with that key (and could sign a malicious update every install accepts).
# Nothing gets write access unless its job needs it.
permissions: {}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      # The updater's notes (latest.json): the summary and plain "• headline"
      # lines. Plain text, since apps before 0.8.7 show it raw in a dialog;
      # newer ones list the headlines in their update prompt.
      updater_notes: ${{ steps.create.outputs.updater_notes }}
      # The Discord announcement text: summary and highlight headlines.
      announce: ${{ steps.create.outputs.announce }}
    steps:
      # A manually run release must name a real version tag; it's passed
      # through the environment, never pasted into the script (injection).
      - name: Validate tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ] && ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v1.2.3, got: $INPUT_TAG" >&2
            exit 1
          fi

      # The release notes are CHANGELOG.md's section for this version, at the
      # tag being released. Only that file is checked out, without credentials.
      - name: Checkout CHANGELOG.md
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Create GitHub Release
        id: create
        env:
          INPUT_TAG: ${{ inputs.tag }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const workflowTag = (process.env.INPUT_TAG || '').trim();
            const tag = workflowTag || context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const downloads = `## Downloads\n| Platform | File |\n|----------|------|\n| Windows | \`.exe\` installer |\n| macOS (Apple Silicon) | \`.dmg\` |\n| macOS (Intel) | \`.dmg\` |\n| Linux | \`.AppImage\` or \`.deb\` |\n\n> **macOS:** SyncCrate isn't notarized by Apple, so macOS blocks it the first time. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to SyncCrate.\n> If macOS says the app "is damaged" instead, open Terminal and run \`xattr -cr /Applications/SyncCrate.app\`, then open SyncCrate normally.\n\n> **Windows:** if SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**.`;

            // This version's section of CHANGELOG.md, without its heading.
            let notes = '';
            try {
              const log = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
              const start = log.search(new RegExp(`^## ${version.replace(/\./g, '\\.')} — `, 'm'));
              if (start >= 0) {
                const rest = log.slice(start);
                const next = rest.slice(3).search(/^## /m);
                notes = (next >= 0 ? rest.slice(0, next + 3) : rest).replace(/^## .*\n/, '').trim();
              }
            } catch {}
            if (!notes) core.warning(`CHANGELOG.md has no "## ${version} — <date>" section: the release keeps its current notes.`);

            // The summary and first four highlight headlines (the same rules as
            // the app's releaseNotes.ts), for the Discord announcement.
            const lines = notes.split('\n');
            const first = [];
            for (const l of lines) {
              if (!l.trim()) { if (first.length) break; continue; }
              first.push(l.trim());
            }
            const summary = first.length && !/^(#|[-*] |>|\|)/.test(first[0]) ? first.join(' ') : '';
            const hl = lines.findIndex((l) => /^###[^\n]*highlights/i.test(l));
            const heads = [];
            for (let i = hl + 1; hl >= 0 && i < lines.length && heads.length < 4; i++) {
              if (/^#{1,3} /.test(lines[i])) break;
              if (!lines[i].startsWith('- ')) continue;
              const item = lines[i].slice(2).trim();
              const bold = /^\*\*(.+?)\*\*/.exec(item);
              const head = bold ? bold[1] : (/^.*?[.!?](?=\s|$)/.exec(item)?.[0] ?? item);
              heads.push('• ' + head.replace(/[`*]/g, '').replace(/[.:]$/, ''));
            }
            const announce = [summary, heads.join('\n'), 'The app updates itself: open SyncCrate and accept the update.\nNew here? Download it from https://synccrate.app']
              .filter(Boolean).join('\n\n').slice(0, 4000);
            core.setOutput('updater_notes', [summary, heads.join('\n')].filter(Boolean).join('\n\n'));
            core.setOutput('announce', announce);
            // Notes written on GitHub by hand are kept when the changelog has none.
            const releaseBody = (current) => notes
              ? `## SyncCrate ${version}\n\n${notes}\n\n---\n\n${downloads}`
              : (current && current.trim() ? current : downloads);

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              const updated = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: `SyncCrate ${tag}`,
                body: releaseBody(existing.data.body),
                draft: false,
                prerelease: false,
              });

              release = updated.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `SyncCrate ${tag}`,
                body: releaseBody(null),
                draft: false,
                prerelease: false,
              });

              release = created.data;
            }

            return release.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - platform: macos-15
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # upload the installers to the release

    steps:
      # A manual run builds the tag it publishes, not whatever branch it was
      # started from.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # No Rust cache here: this job holds the signing key, and a poisoned
      # cache entry would run its code (build scripts) next to it.

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Linux dependencies required by Tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: synccrate
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: synccrate
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.updater_notes }}
          updaterJsonKeepUniversal: true
          args: --target ${{ matrix.target }}

  # Opens a PR on microsoft/winget-pkgs for the new version, so
  # `winget install stixez.SyncCrate` works (and skips the browser download
  # SmartScreen flags). Its own job: the WINGET_TOKEN PAT never shares a
  # runner with the updater signing key. Does nothing until that secret
  # exists, and the package's first version has to be submitted by hand.
  winget:
    name: Publish to winget
    needs: build
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Check for the winget token
        id: token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        # Updates need the package to exist in winget-pkgs (the first
        # version is reviewed by hand), so skip until it's there.
        run: |
          if [ -z "$WINGET_TOKEN" ]; then echo "No WINGET_TOKEN secret: skipping winget."; exit 0; fi
          if ! curl -sf -o /dev/null https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/s/stixez/SyncCrate; then
            echo "stixez.SyncCrate isn't in winget-pkgs yet: skipping winget."; exit 0
          fi
          echo "set=true" >> "$GITHUB_OUTPUT"

      - name: Open the winget-pkgs PR
        if: steps.token.outputs.set == 'true'
        uses: vedantmgoyal9/winget-releaser@f29ed1ffd34f91223a2aebaa71beaab0901ff9fd # v2
        with:
          identifier: stixez.SyncCrate
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ inputs.tag || github.ref_name }}
          max-versions-to-keep: 3
          token: ${{ secrets.WINGET_TOKEN }}

  # Posts the release to #announcements on the SyncCrate Discord and pings
  # the opt-in Updates role. Runs here, not as its own `release: published`
  # workflow: a release made with GITHUB_TOKEN doesn't trigger other
  # workflows. Does nothing until the DISCORD_RELEASE_WEBHOOK secret exists.
  discord:
    name: Announce on Discord
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "Post to #announcements"
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          NOTES: ${{ needs.create-release.outputs.announce }}
          UPDATES_ROLE: "1565000145802895427"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_RELEASE_WEBHOOK secret: skipping Discord."; exit 0; fi
          jq -n --arg tag "$TAG" --arg repo "$REPO" --arg role "$UPDATES_ROLE" --arg notes "$NOTES" '{
            content: "<@&\($role)> SyncCrate \($tag) is out!",
            allowed_mentions: { roles: [$role] },
            embeds: [{
              title: "SyncCrate \($tag)",
              url: "https://github.com/\($repo)/releases/tag/\($tag)",
              description: (if $notes == "" then "The app updates itself: open SyncCrate and accept the update.\nNew here? Download it from https://synccrate.app" else $notes end),
              color: 2078846,
              thumbnail: { url: "https://synccrate.app/apple-touch-icon.png" },
              footer: { text: "Windows · macOS · Linux" }
            }]
          }' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
