name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string

# Every action is pinned to a commit: this workflow holds the updater
# signing key, and a moved tag on a third-party action would run its code
# with that key (and could sign a malicious update every install accepts).
# Nothing gets write access unless its job needs it.
permissions: {}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      # A manually run release must name a real version tag; it's passed
      # through the environment, never pasted into the script (injection).
      - name: Validate tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ] && ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v1.2.3, got: $INPUT_TAG" >&2
            exit 1
          fi

      # The release notes are CHANGELOG.md's section for this version, at the
      # tag being released. Only that file is checked out, without credentials.
      - name: Checkout CHANGELOG.md
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Create GitHub Release
        id: create
        env:
          INPUT_TAG: ${{ inputs.tag }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const workflowTag = (process.env.INPUT_TAG || '').trim();
            const tag = workflowTag || context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const downloads = `## Downloads\n| Platform | File |\n|----------|------|\n| Windows | \`.exe\` installer |\n| macOS (Apple Silicon) | \`.dmg\` |\n| macOS (Intel) | \`.dmg\` |\n| Linux | \`.AppImage\` or \`.deb\` |\n\n> **macOS:** SyncCrate isn't notarized by Apple, so macOS blocks it the first time. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to SyncCrate.\n> If macOS says the app "is damaged" instead, open Terminal and run \`xattr -cr /Applications/SyncCrate.app\`, then open SyncCrate normally.\n\n> **Windows:** if SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**.`;

            // This version's section of CHANGELOG.md, without its heading.
            let notes = '';
            try {
              const log = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
              const start = log.search(new RegExp(`^## ${version.replace(/\./g, '\\.')} — `, 'm'));
              if (start >= 0) {
                const rest = log.slice(start);
                const next = rest.slice(3).search(/^## /m);
                notes = (next >= 0 ? rest.slice(0, next + 3) : rest).replace(/^## .*\n/, '').trim();
              }
            } catch {}
            if (!notes) core.warning(`CHANGELOG.md has no "## ${version} — <date>" section: the release keeps its current notes.`);
            // Notes written on GitHub by hand are kept when the changelog has none.
            const releaseBody = (current) => notes
              ? `## SyncCrate ${version}\n\n${notes}\n\n---\n\n${downloads}`
              : (current && current.trim() ? current : downloads);

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              const updated = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: `SyncCrate ${tag}`,
                body: releaseBody(existing.data.body),
                draft: false,
                prerelease: false,
              });

              release = updated.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `SyncCrate ${tag}`,
                body: releaseBody(null),
                draft: false,
                prerelease: false,
              });

              release = created.data;
            }

            return release.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - platform: macos-15
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # upload the installers to the release

    steps:
      # A manual run builds the tag it publishes, not whatever branch it was
      # started from.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # No Rust cache here: this job holds the signing key, and a poisoned
      # cache entry would run its code (build scripts) next to it.

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Linux dependencies required by Tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: synccrate
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: synccrate
          releaseId: ${{ needs.create-release.outputs.release_id }}
          updaterJsonKeepUniversal: true
          args: --target ${{ matrix.target }}

  # Opens a PR on microsoft/winget-pkgs for the new version, so
  # `winget install stixez.SyncCrate` works (and skips the browser download
  # SmartScreen flags). Its own job: the WINGET_TOKEN PAT never shares a
  # runner with the updater signing key. Does nothing until that secret
  # exists, and the package's first version has to be submitted by hand.
  winget:
    name: Publish to winget
    needs: build
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Check for the winget token
        id: token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else echo "No WINGET_TOKEN secret: skipping winget."; fi

      - name: Open the winget-pkgs PR
        if: steps.token.outputs.set == 'true'
        uses: vedantmgoyal9/winget-releaser@f29ed1ffd34f91223a2aebaa71beaab0901ff9fd # v2
        with:
          identifier: stixez.SyncCrate
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ inputs.tag || github.ref_name }}
          max-versions-to-keep: 3
          token: ${{ secrets.WINGET_TOKEN }}

  # Posts the release to #announcements on the SyncCrate Discord and pings
  # the opt-in Updates role. Runs here, not as its own `release: published`
  # workflow: a release made with GITHUB_TOKEN doesn't trigger other
  # workflows. Does nothing until the DISCORD_RELEASE_WEBHOOK secret exists.
  discord:
    name: Announce on Discord
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout CHANGELOG.md
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: "Post to #announcements"
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          UPDATES_ROLE: "1565000145802895427"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_RELEASE_WEBHOOK secret: skipping Discord."; exit 0; fi
          # The version's summary and highlight headlines from CHANGELOG.md.
          python3 - "$TAG" > notes.txt <<'PY'
          import re, sys
          version = sys.argv[1].lstrip("v")
          try:
              log = open("CHANGELOG.md", encoding="utf-8").read()
          except OSError:
              log = ""
          m = re.search(r"^## " + re.escape(version) + r" — .*?\n(.*?)(?=^## |\Z)", log, re.M | re.S)
          body = m.group(1).strip() if m else ""
          summary = body.split("\n\n")[0].strip() if body and not body.startswith(("#", "-", ">")) else ""
          hl = re.search(r"^### .*Highlights.*?\n(.*?)(?=^#|\Z)", body, re.M | re.S | re.I)
          heads = []
          for line in (hl.group(1) if hl else "").splitlines():
              if line.startswith("- "):
                  bold = re.match(r"- \*\*(.+?)\*\*", line)
                  heads.append("• " + (bold.group(1) if bold else line[2:]).rstrip(".:"))
          parts = [p for p in [summary, "\n".join(heads[:5])] if p]
          parts.append("The app updates itself: open SyncCrate and accept the update.\nNew here? Download it from https://synccrate.app")
          print("\n\n".join(parts)[:4000])
          PY
          jq -n --arg tag "$TAG" --arg repo "$REPO" --arg role "$UPDATES_ROLE" --rawfile notes notes.txt '{
            content: "<@&\($role)> SyncCrate \($tag) is out!",
            allowed_mentions: { roles: [$role] },
            embeds: [{
              title: "SyncCrate \($tag)",
              url: "https://github.com/\($repo)/releases/tag/\($tag)",
              description: ($notes | rtrimstr("\n")),
              color: 2078846,
              thumbnail: { url: "https://synccrate.app/apple-touch-icon.png" },
              footer: { text: "Windows · macOS · Linux" }
            }]
          }' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
