  <path d="M112 24H488V400L400 488H24V112Z" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Crate: frame, lid band and diagonal brace (same geometry as BrandMark in Sidebar.tsx) -->
  <g fill="none" stroke="#04110a" stroke-linecap="square">
    <rect x="140" y="156" width="232" height="216" stroke-width="36"/>
    <path d="M140 222H372" stroke-width="36"/>
    <path d="M166 348 346 240" stroke-width="30"/>
