<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ff7c4"/>
      <stop offset="55%" stop-color="#4cf0b2"/>
      <stop offset="100%" stop-color="#1fb87e"/>
    </linearGradient>
  </defs>

  <!-- HUD tile: top-left and bottom-right corners clipped, like the app's panels -->
